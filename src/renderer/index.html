<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>校校云客户端</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z" fill="currentColor" opacity=".9"/><path d="M5.5 11v5.2c0 .7.4 1.3 1 1.6l4.4 2.2c.7.4 1.5.4 2.2 0l4.4-2.2c.6-.3 1-.9 1-1.6V11l-7 3.5L5.5 11Z" fill="currentColor" opacity=".55"/></svg>
      </span>
      <span class="window-title" id="pageTitle">校校云</span>
    </div>

    <div class="title-status" id="toast" hidden></div>

    <div class="actions">
      <button class="icon-btn" id="btnRefresh" title="刷新页面">
        <svg viewBox="0 0 24 24" width="15" height="15" class="icon-refresh"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btnAutoLogin" title="立即执行自动登录">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3a4 4 0 0 1 4 4v1h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h1V7a4 4 0 0 1 4-4Zm-2 5h4V7a2 2 0 1 0-4 0v1Zm2 5a2 2 0 0 0-1 3.7V18h2v-1.3A2 2 0 0 0 12 13Z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.4 5.1.9 1.5-1.9 3.2-1.7-.4a7.4 7.4 0 0 1-1.6.9l-.4 1.7h-3.7l-.4-1.7a7.4 7.4 0 0 1-1.6-.9l-1.7.4-1.9-3.2.9-1.5a7.6 7.6 0 0 1 0-1.9l-.9-1.5 1.9-3.2 1.7.4c.5-.4 1-.7 1.6-.9l.4-1.7h3.7l.4 1.7c.6.2 1.1.5 1.6.9l1.7-.4 1.9 3.2-.9 1.5a7.6 7.6 0 0 1 0 1.9Z" fill="currentColor" opacity=".85"/></svg>
      </button>

      <div class="divider"></div>

      <button class="win-btn" id="btnMinimize" title="最小化">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 11h14v2H5z" fill="currentColor"/></svg>
      </button>
      <button class="win-btn" id="btnMaximize" title="最大化">
        <svg viewBox="0 0 24 24" width="14" height="14"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="win-btn win-btn-close" id="btnClose" title="关闭">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M7.4 6 12 10.6 16.6 6 18 7.4 13.4 12 18 16.6 16.6 18 12 13.4 7.4 18 6 16.6 10.6 12 6 7.4Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <main class="stage" id="stage">
    <section class="empty-state" id="emptyState">
      <div class="empty-card">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z" fill="currentColor" opacity=".9"/><path d="M5.5 11v5.2c0 .7.4 1.3 1 1.6l4.4 2.2c.7.4 1.5.4 2.2 0l4.4-2.2c.6-.3 1-.9 1-1.6V11l-7 3.5L5.5 11Z" fill="currentColor" opacity=".5"/></svg>
        </div>
        <h1>还没有配置站点地址</h1>
        <p>校校云客户端直接加载原网页。在设置里填入站点地址，就能获得带标题栏、刷新与账号自动登录的桌面体验。</p>
        <button class="primary-btn" id="btnOpenSettings">打开设置</button>
      </div>
    </section>
  </main>

<div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <header class="drawer-head">
      <div>
        <h2>设置</h2>
        <p class="drawer-sub">账号密码加密后只保存在本机，不会上传</p>
      </div>
      <button class="icon-btn" id="btnCloseSettings" title="关闭设置">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M7.4 6 12 10.6 16.6 6 18 7.4 13.4 12 18 16.6 16.6 18 12 13.4 7.4 18 6 16.6 10.6 12 6 7.4Z" fill="currentColor"/></svg>
      </button>
    </header>

    <section class="field-group">
      <label class="field-label" for="inputSiteUrl">站点地址</label>
      <div class="row">
        <input class="text-input" id="inputSiteUrl" type="text" placeholder="https://你的校校云站点地址" spellcheck="false" />
        <button class="primary-btn small" id="btnSaveUrl">保存</button>
      </div>
      <p class="hint">支持完整 URL；只填域名会自动补 https://</p>
    </section>

    <section class="field-group">
      <div class="switch-row">
        <div>
          <label class="field-label" for="toggleAutoLogin">自动登录</label>
          <p class="hint">页面加载后自动填充当前账号并提交</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleAutoLogin" />
          <span class="switch-track"></span>
        </label>
      </div>
    </section>

    <section class="field-group">
      <div class="section-title">
        <label class="field-label">账号</label>
        <button class="ghost-btn small" id="btnLoginNow">立即登录一次</button>
      </div>
      <ul class="account-list" id="accountList"></ul>
      <p class="hint empty-accounts" id="emptyAccounts">还没有账号，添加后即可自动登录</p>

      <div class="account-form">
        <input class="text-input" id="inputUsername" type="text" placeholder="账号 / 用户名" autocomplete="off" />
        <input class="text-input" id="inputPassword" type="password" placeholder="密码" autocomplete="off" />
        <button class="primary-btn small full" id="btnAddAccount">添加账号</button>
      </div>
      <p class="hint error" id="formError" hidden></p>
    </section>
    <section class="field-group">
      <label class="field-label">数据位置</label>
      <p class="storage-path" id="storagePath">—</p>
      <p class="hint" id="storageHint"></p>
    </section>

  </aside>

  <script src="app.js"></script>
</body>
</html>
