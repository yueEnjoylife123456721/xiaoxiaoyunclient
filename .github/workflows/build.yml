name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 打包 ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            script: npm run dist:win
            path: dist/*.exe
          - os: ubuntu-latest
            artifact: linux
            script: npm run dist:linux
            path: dist/*.AppImage
          - os: macos-latest
            artifact: macos
            script: npm run dist:mac
            path: dist/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包
        run: ${{ matrix.script }}
        env:
          # 只是本地打包，不走发布
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxiaoyunclient-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
